<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Editar site — Maria Eduarda Miranda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Work+Sans:wght@400;500;600;700&display=swap">
<style>
  :root {
    --brand: #002f5f;
    --brand-strong: #00224a;
    --brand-soft: #e3eaf3;
    --ink: #1a2430;
    --ink-muted: #5c6b7a;
    --border: #dde4ee;
    --surface: #f6f8fb;
    --bg: #ffffff;
    --radius: 6px;
    --font-display: "Fraunces", Georgia, serif;
    --font-sans: "Work Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: var(--font-sans);
    background: var(--surface);
    color: var(--ink);
    line-height: 1.5;
  }
  header {
    background: var(--brand-strong);
    color: #fff;
    padding: 1.1rem 1.25rem;
    font-family: var(--font-display);
    font-size: 1.15rem;
    font-weight: 600;
  }
  .wrap { max-width: 52rem; margin: 0 auto; padding: 1.5rem 1.25rem 4rem; }

  /* Login screen */
  #login-screen {
    max-width: 26rem;
    margin: 4rem auto;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 2rem;
    box-shadow: 0 4px 18px rgba(0,47,95,0.08);
  }
  #login-screen h2 { font-family: var(--font-display); color: var(--brand-strong); margin: 0 0 .3rem; }
  #login-screen p { color: var(--ink-muted); margin: 0 0 1.25rem; font-size: .92rem; }
  #login-screen input {
    width: 100%; padding: .65rem .8rem; border: 1px solid var(--border);
    border-radius: var(--radius); font-size: 1rem; font-family: inherit;
  }
  #login-screen button, .btn-primary {
    margin-top: .9rem; width: 100%; padding: .7rem 1rem; background: var(--brand-strong);
    color: #fff; border: none; border-radius: var(--radius); font-weight: 600;
    font-size: .95rem; cursor: pointer; font-family: inherit;
  }
  #login-screen button:hover, .btn-primary:hover { background: var(--brand); }
  #login-error { color: #b3261e; font-size: .88rem; margin-top: .6rem; min-height: 1.2em; }

  /* Editor */
  #editor { display: none; }
  .section-card {
    background: var(--bg); border: 1px solid var(--border); border-radius: 8px;
    padding: 1.25rem 1.4rem; margin-bottom: 1.1rem;
  }
  .section-card h3 {
    font-family: var(--font-display); color: var(--brand-strong); margin: 0 0 1rem;
    font-size: 1.15rem; border-bottom: 1px solid var(--border); padding-bottom: .6rem;
  }
  .collection-hint { color: var(--ink-muted); font-size: .85rem; margin: -.5rem 0 1rem; }
  .field { margin-bottom: 1rem; }
  .field:last-child { margin-bottom: 0; }
  .field label {
    display: block; font-size: .82rem; font-weight: 600; color: var(--ink);
    margin-bottom: .4rem;
  }
  .lang-row { display: grid; grid-template-columns: 2.4rem 1fr; gap: .5rem; align-items: start; margin-bottom: .4rem; }
  .lang-row:last-child { margin-bottom: 0; }
  .lang-tag {
    font-size: .72rem; font-weight: 700; color: var(--brand-strong); background: var(--brand-soft);
    border-radius: 4px; padding: .3rem 0; text-align: center; margin-top: .1rem;
  }
  .lang-row input, .lang-row textarea, .field > input {
    width: 100%; padding: .5rem .65rem; border: 1px solid var(--border); border-radius: var(--radius);
    font-family: inherit; font-size: .92rem; resize: vertical;
  }
  .lang-row textarea { min-height: 4.5rem; }
  .readonly-text {
    width: 100%; padding: .5rem .65rem; border: 1px solid var(--border); border-radius: var(--radius);
    background: var(--surface); color: var(--ink-muted); font-size: .92rem; min-height: 2.3rem;
    white-space: pre-wrap; overflow-wrap: anywhere;
  }

  /* Repeatable collection items (projects / publications / certificates) */
  .item-card {
    background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
    padding: 1rem 1.1rem; margin-bottom: 1rem;
  }
  .item-card:last-of-type { margin-bottom: 0; }
  .item-head {
    display: flex; align-items: center; justify-content: space-between; gap: .6rem;
    margin-bottom: .9rem; flex-wrap: wrap;
  }
  .item-label { font-weight: 700; color: var(--brand-strong); font-size: .95rem; }
  .item-btn-row { display: flex; gap: .4rem; flex-wrap: wrap; }
  .btn-move, .btn-remove, .btn-add {
    font-family: inherit; font-size: .78rem; font-weight: 600; cursor: pointer;
    border-radius: 4px; padding: .35rem .6rem; border: 1px solid var(--border); background: var(--bg);
    color: var(--ink);
  }
  .btn-move:hover { border-color: var(--brand); color: var(--brand-strong); }
  .btn-remove { color: #b3261e; border-color: #f0c9c5; }
  .btn-remove:hover { background: #fdf1f0; }
  .btn-add {
    margin-top: .5rem; border-style: dashed; color: var(--brand-strong); border-color: var(--brand);
    width: 100%; padding: .6rem; background: var(--brand-soft);
  }
  .btn-add:hover { background: var(--brand-soft); filter: brightness(0.97); }
  .collection-empty { color: var(--ink-muted); font-size: .88rem; font-style: italic; margin: 0 0 .75rem; }

  /* Clickable "circle" choice pills (used for the language/level picker) */
  .choice-group { display: flex; flex-wrap: wrap; gap: .5rem; }
  .choice-pill {
    font-family: inherit; font-size: .85rem; font-weight: 600; cursor: pointer;
    border-radius: 999px; padding: .45rem 1.05rem; border: 1.5px solid var(--border); background: var(--bg);
    color: var(--ink);
  }
  .choice-pill:hover { border-color: var(--brand); color: var(--brand-strong); }
  .choice-pill.is-selected { background: var(--brand-strong); border-color: var(--brand-strong); color: #fff; }

  .toolbar {
    position: sticky; bottom: 0; background: var(--bg); border-top: 1px solid var(--border);
    padding: 1rem 1.25rem; display: flex; align-items: center; gap: 1rem; justify-content: space-between;
    box-shadow: 0 -4px 18px rgba(0,0,0,0.06);
  }
  .toolbar .btn-primary { width: auto; padding: .75rem 1.6rem; margin: 0; }
  #status { font-size: .9rem; }
  #status.ok { color: #1a7f37; }
  #status.err { color: #b3261e; }
  .logout-link { background: none; border: none; color: var(--ink-muted); font-size: .85rem; cursor: pointer; text-decoration: underline; padding: 0; font-family: inherit; }
  #editor-loading { text-align: center; color: var(--ink-muted); padding: 3rem 0; }
</style>
</head>
<body>

<header>Painel de edição — Maria Eduarda Miranda</header>

<div class="wrap">

  <div id="login-screen">
    <h2>Entrar</h2>
    <p>Digite a senha para editar o conteúdo do site.</p>
    <input type="password" id="password-input" placeholder="Senha" autocomplete="current-password">
    <button id="login-btn" type="button">Entrar</button>
    <div id="login-error"></div>
  </div>

  <div id="editor">
    <div id="editor-loading">Carregando conteúdo…</div>
    <div id="photo-card-root"></div>
    <div id="sections"></div>
    <div id="languages-root"></div>
    <div id="collections-root"></div>
    <div id="custom-sections-root"></div>
  </div>

</div>

<div class="toolbar" id="toolbar" style="display:none;">
  <button class="logout-link" id="logout-btn" type="button">Sair</button>
  <span id="status"></span>
  <button class="btn-primary" id="save-btn" type="button">Salvar alterações</button>
</div>

<script>
(function () {
  var TOKEN_KEY = "adminToken";

  // Only genuinely variable, personal information is editable here — the
  // site's base copy (nav labels, section titles/leads, button text, the
  // bio paragraph, etc.) is fixed on purpose and isn't shown in this
  // panel at all. Saving still preserves those fixed texts untouched
  // (see collectContent()).
  var SECTIONS = [
    { title: "Contato e Localização", keys: ["contact_email_value", "contact_phone_value", "contact_location_value"] }
  ];

  var LABELS = {
    contact_email_value: "Endereço de email exibido (o mesmo vale para os 3 idiomas)",
    contact_phone_value: "Telefone exibido, com código do país (ex.: +54 11 6690-9485) — o mesmo vale para os 3 idiomas",
    contact_location_value: "Cidade/país exibido em Localização (o mesmo vale para os 3 idiomas)"
  };

  var TEXTAREA_KEYS = [];

  // Fields that are the same regardless of language (an email address,
  // a phone number, a city) get a single input instead of three EN/PT/ES
  // rows — the same value is written into all three language dictionaries.
  var UNTRANSLATED_KEYS = ["contact_email_value", "contact_phone_value", "contact_location_value"];

  var LANGS = [
    { code: "en", tag: "EN" },
    { code: "pt", tag: "PT" },
    { code: "es", tag: "ES" }
  ];

  // ---------------------------------------------------------
  // Repeatable collections: Projects, Education, Certificates,
  // Publications. Maria can add new items or remove existing ones, and
  // reorder them — but once an item has been saved, its text can no
  // longer be edited in place; to change it she removes it and creates
  // a new one (see the read-only rendering in renderItemList()).
  // Certificates and Publications now render inside the Education
  // section on the site (as sub-lists), and stay hidden there until
  // the list has at least one item. Projects and Education always stay
  // visible (she starts with one entry in each).
  // ---------------------------------------------------------
  var LOCK_NOTE = " Depois de salvo, um item não pode mais ser editado — só removido. Para mudar o texto, remova e crie um novo.";
  var TRANSLATE_NOTE = " Escreva em português — o inglês e o espanhol são preenchidos automaticamente por tradução quando você clicar em “Salvar alterações”.";

  // ---------------------------------------------------------
  // Auto-translation: Maria writes each field once, in Portuguese, and
  // the English/Spanish versions are filled in automatically at save
  // time via a free machine-translation API (MyMemory). This never
  // blocks saving — if a translation call fails, the Portuguese text is
  // used as a fallback for that language and a warning is shown so she
  // knows to double-check it later.
  // ---------------------------------------------------------
  var translationHadError = false;

  function translateText(text, targetLangCode) {
    if (!text || !text.trim()) return Promise.resolve("");
    var email = (originalContent && originalContent.en && originalContent.en.contact_email_value) || "";
    var url = "https://api.mymemory.translated.net/get?q=" + encodeURIComponent(text) +
      "&langpair=pt|" + targetLangCode + (email ? "&de=" + encodeURIComponent(email) : "");
    return fetch(url)
      .then(function (r) { return r.json(); })
      .then(function (data) {
        var translated = data && data.responseData && data.responseData.translatedText;
        if (!translated || /INVALID|MYMEMORY WARNING/i.test(translated)) throw new Error("bad translation response");
        return translated;
      });
  }

  // Translates one plain-text (Portuguese) field into { en, pt, es }.
  function translateField(text) {
    text = text || "";
    return Promise.all([
      translateText(text, "en").catch(function () { translationHadError = true; return text; }),
      translateText(text, "es").catch(function () { translationHadError = true; return text; })
    ]).then(function (results) {
      return { en: results[0], pt: text, es: results[1] };
    });
  }

  // Same idea for a comma-separated tag list: translate the joined text
  // once per language, then split back into an array.
  function translateTagsField(text) {
    text = text || "";
    function splitTags(s) {
      return (s || "").split(",").map(function (t) { return t.trim(); }).filter(Boolean);
    }
    return Promise.all([
      translateText(text, "en").catch(function () { translationHadError = true; return text; }),
      translateText(text, "es").catch(function () { translationHadError = true; return text; })
    ]).then(function (results) {
      return { en: splitTags(results[0]), pt: splitTags(text), es: splitTags(results[1]) };
    });
  }

  // Walks every translated field of a not-yet-saved item and replaces its
  // plain Portuguese string with the translated { en, pt, es } object.
  function translateNewItemFields(item, fieldsDef) {
    var jobs = [];
    fieldsDef.forEach(function (f) {
      if (!f.translated) return;
      if (typeof item[f.name] !== "string") return; // already an {en,pt,es} object (locked/existing item)
      var job = f.type === "taglist" ? translateTagsField(item[f.name]) : translateField(item[f.name]);
      jobs.push(job.then(function (result) { item[f.name] = result; }));
    });
    return Promise.all(jobs);
  }

  var COLLECTIONS = [
    {
      key: "projects",
      title: "Projetos e Atuação (itens da lista)",
      hint: "Aparecem na seção “Projetos e Atuação”, sempre visível no site." + LOCK_NOTE + TRANSLATE_NOTE,
      periodField: { name: "period", label: "Ano / Período" },
      fields: [
        { name: "title", label: "Título", translated: true, type: "textarea" },
        { name: "subtitle", label: "Subtítulo (cargo / instituição)", translated: true, type: "text" },
        { name: "desc", label: "Descrição", translated: true, type: "textarea" },
        { name: "tags", label: "Tags (separe por vírgula)", translated: true, type: "taglist" },
        { name: "link", label: "Link (opcional)", translated: false, type: "text" }
      ]
    },
    {
      key: "education",
      title: "Formação (itens da lista)",
      hint: "Aparecem na seção “Formação”, sempre visível no site. Use um item por curso/grau (ex.: se ela tiver uma graduação anterior, um intercâmbio, etc., pode adicionar mais de um)." + LOCK_NOTE + TRANSLATE_NOTE,
      periodField: { name: "period", label: "Período (ex.: 2022 — 2028)" },
      fields: [
        { name: "title", label: "Nome do curso / grau", translated: true, type: "text" },
        { name: "subtitle", label: "Instituição", translated: true, type: "text" },
        { name: "desc", label: "Descrição", translated: true, type: "textarea" }
      ]
    },
    {
      key: "certificates",
      title: "Certificados e Cursos (itens da lista)",
      hint: "Aparecem dentro da seção “Formação”, junto com o resto do currículo. Enquanto a lista estiver vazia, esse bloco não aparece no site." + LOCK_NOTE + TRANSLATE_NOTE,
      periodField: { name: "date", label: "Data / Ano" },
      fields: [
        { name: "title", label: "Nome do certificado / curso", translated: true, type: "textarea" },
        { name: "issuer", label: "Instituição emissora", translated: true, type: "text" },
        { name: "link", label: "Link do certificado (opcional)", translated: false, type: "text" }
      ]
    },
    {
      key: "publications",
      title: "Artigos e Publicações (itens da lista)",
      hint: "Aparecem dentro da seção “Formação”, junto com o resto do currículo. Enquanto a lista estiver vazia, esse bloco não aparece no site." + LOCK_NOTE + TRANSLATE_NOTE,
      periodField: { name: "year", label: "Ano" },
      fields: [
        { name: "title", label: "Título do artigo / trabalho", translated: true, type: "textarea" },
        { name: "venue", label: "Revista / evento / onde foi publicado", translated: true, type: "text" },
        { name: "link", label: "Link (DOI, PDF, etc. — opcional)", translated: false, type: "text" }
      ]
    }
  ];

  var loginScreen = document.getElementById("login-screen");
  var editor = document.getElementById("editor");
  var editorLoading = document.getElementById("editor-loading");
  var photoCardRoot = document.getElementById("photo-card-root");
  var sectionsEl = document.getElementById("sections");
  var collectionsRoot = document.getElementById("collections-root");
  var toolbar = document.getElementById("toolbar");
  var statusEl = document.getElementById("status");
  var fieldRefs = {}; // key -> { en: input, pt: input, es: input }
  var collectionsData = { projects: [], publications: [], certificates: [], education: [], languages: [] };
  var originalContent = null; // the site's fixed texts, exactly as loaded — never edited by this panel

  // Marks every item in a list as already-saved (read-only in the UI).
  function markExisting(list) {
    (list || []).forEach(function (item) { item._existing = true; });
    return list || [];
  }

  function getToken() {
    try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }
  function setToken(token) {
    try { sessionStorage.setItem(TOKEN_KEY, token); } catch (e) {}
  }
  function clearToken() {
    try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function showLogin(message) {
    loginScreen.style.display = "block";
    editor.style.display = "none";
    toolbar.style.display = "none";
    document.getElementById("login-error").textContent = message || "";
  }

  function showEditor() {
    loginScreen.style.display = "none";
    editor.style.display = "block";
    toolbar.style.display = "flex";
  }

  function buildForm(content) {
    sectionsEl.innerHTML = "";
    fieldRefs = {};

    SECTIONS.forEach(function (section) {
      var card = document.createElement("div");
      card.className = "section-card";

      var h3 = document.createElement("h3");
      h3.textContent = section.title;
      card.appendChild(h3);

      section.keys.forEach(function (key) {
        var field = document.createElement("div");
        field.className = "field";

        var label = document.createElement("label");
        label.textContent = LABELS[key] || key;
        field.appendChild(label);

        fieldRefs[key] = {};

        if (UNTRANSLATED_KEYS.indexOf(key) !== -1) {
          // One value shared across all three languages: a single input,
          // wired into all three fieldRefs slots so collectContent()
          // writes the same text into en/pt/es without special-casing.
          var singleInput = document.createElement("input");
          singleInput.type = "text";
          singleInput.value = (content.en && content.en[key]) || "";
          field.appendChild(singleInput);
          LANGS.forEach(function (lang) {
            fieldRefs[key][lang.code] = singleInput;
          });
        } else {
          LANGS.forEach(function (lang) {
            var row = document.createElement("div");
            row.className = "lang-row";

            var tag = document.createElement("div");
            tag.className = "lang-tag";
            tag.textContent = lang.tag;
            row.appendChild(tag);

            var isLong = TEXTAREA_KEYS.indexOf(key) !== -1;
            var input = document.createElement(isLong ? "textarea" : "input");
            if (!isLong) input.type = "text";
            input.value = (content[lang.code] && content[lang.code][key]) || "";
            row.appendChild(input);

            fieldRefs[key][lang.code] = input;
            field.appendChild(row);
          });
        }

        card.appendChild(field);
      });

      sectionsEl.appendChild(card);
    });
  }

  // ---- Collections: blank item factories -------------------

  // New items store each translated field as a single Portuguese string
  // until save time, when translateNewItemFields() turns it into the
  // { en, pt, es } shape the site (and an existing/locked item) expects.
  function blankItem(key) {
    if (key === "projects") {
      return { period: "", title: "", subtitle: "", desc: "", tags: "", link: "" };
    }
    if (key === "publications") {
      return { year: "", title: "", venue: "", link: "" };
    }
    if (key === "certificates") {
      return { date: "", title: "", issuer: "", link: "" };
    }
    if (key === "education") {
      return { period: "", title: "", subtitle: "", desc: "" };
    }
    return {};
  }

  // ---- Collections: rendering -------------------------------

  function buildCollectionsUI() {
    collectionsRoot.innerHTML = "";
    COLLECTIONS.forEach(function (colDef) {
      var card = document.createElement("div");
      card.className = "section-card";

      var h3 = document.createElement("h3");
      h3.textContent = colDef.title;
      card.appendChild(h3);

      if (colDef.hint) {
        var hint = document.createElement("p");
        hint.className = "collection-hint";
        hint.textContent = colDef.hint;
        card.appendChild(hint);
      }

      var itemsWrap = document.createElement("div");
      itemsWrap.id = "collection-items-" + colDef.key;
      card.appendChild(itemsWrap);

      var addBtn = document.createElement("button");
      addBtn.type = "button";
      addBtn.className = "btn-add";
      addBtn.textContent = "+ Adicionar novo";
      addBtn.addEventListener("click", function () {
        collectionsData[colDef.key].push(blankItem(colDef.key));
        renderCollectionItems(colDef);
      });
      card.appendChild(addBtn);

      collectionsRoot.appendChild(card);
      renderCollectionItems(colDef);
    });
  }

  // Renders one field's value as plain read-only text (used once an item
  // is locked — see below) instead of an input, so Maria can still see
  // what's there without being able to type into it.
  function appendReadonlyRow(field, tag, text) {
    var row = document.createElement("div");
    row.className = "lang-row";
    var tagEl = document.createElement("div");
    tagEl.className = "lang-tag";
    tagEl.textContent = tag;
    row.appendChild(tagEl);
    var value = document.createElement("div");
    value.className = "readonly-text";
    value.textContent = text || "—";
    row.appendChild(value);
    field.appendChild(row);
  }

  // Generic item-list renderer, shared by the four fixed collections
  // (projects/education/certificates/publications) AND by the items
  // inside every custom section Maria creates. `list` is mutated in
  // place; `onChange` re-renders (called after add/remove/reorder —
  // never on every keystroke, so typing never loses focus).
  //
  // Once an item has been saved (item._existing === true), its text
  // fields render as read-only — she can reorder or remove it, but not
  // edit the text in place. A newly added, not-yet-saved item still
  // renders as an editable form. This is intentional: to change an
  // existing item's text, she removes it and creates a new one.
  function renderItemList(containerId, list, fieldsDef, periodField, onChange) {
    var wrap = document.getElementById(containerId);
    if (!wrap) return;
    wrap.innerHTML = "";

    if (list.length === 0) {
      var empty = document.createElement("p");
      empty.className = "collection-empty";
      empty.textContent = "Nenhum item ainda. Clique em “+ Adicionar novo” abaixo para criar o primeiro.";
      wrap.appendChild(empty);
      return;
    }

    list.forEach(function (item, index) {
      var locked = !!item._existing;
      var itemCard = document.createElement("div");
      itemCard.className = "item-card";

      var itemHead = document.createElement("div");
      itemHead.className = "item-head";

      var itemLabel = document.createElement("span");
      itemLabel.className = "item-label";
      itemLabel.textContent = "Item #" + (index + 1) + (locked ? " (já salvo)" : " (novo — ainda não salvo)");
      itemHead.appendChild(itemLabel);

      var btnRow = document.createElement("div");
      btnRow.className = "item-btn-row";

      if (index > 0) {
        var upBtn = document.createElement("button");
        upBtn.type = "button";
        upBtn.className = "btn-move";
        upBtn.textContent = "▲ Subir";
        upBtn.addEventListener("click", function () {
          var tmp = list[index - 1];
          list[index - 1] = list[index];
          list[index] = tmp;
          onChange();
        });
        btnRow.appendChild(upBtn);
      }
      if (index < list.length - 1) {
        var downBtn = document.createElement("button");
        downBtn.type = "button";
        downBtn.className = "btn-move";
        downBtn.textContent = "▼ Descer";
        downBtn.addEventListener("click", function () {
          var tmp = list[index + 1];
          list[index + 1] = list[index];
          list[index] = tmp;
          onChange();
        });
        btnRow.appendChild(downBtn);
      }

      var removeBtn = document.createElement("button");
      removeBtn.type = "button";
      removeBtn.className = "btn-remove";
      removeBtn.textContent = "Remover";
      removeBtn.addEventListener("click", function () {
        if (!window.confirm("Remover este item da lista? Isso só é definitivo depois de clicar em “Salvar alterações”.")) return;
        list.splice(index, 1);
        onChange();
      });
      btnRow.appendChild(removeBtn);

      itemHead.appendChild(btnRow);
      itemCard.appendChild(itemHead);

      if (locked) {
        var lockedNote = document.createElement("p");
        lockedNote.className = "collection-hint";
        lockedNote.style.margin = "-.4rem 0 .9rem";
        lockedNote.textContent = "Já salvo — o texto não pode mais ser editado aqui. Para mudar, remova e crie um novo item.";
        itemCard.appendChild(lockedNote);
      }

      // Period-like field (untranslated, single value: period / year / date)
      var pf = periodField;
      var pField = document.createElement("div");
      pField.className = "field";
      var pLabel = document.createElement("label");
      pLabel.textContent = pf.label;
      pField.appendChild(pLabel);
      if (locked) {
        var pText = document.createElement("div");
        pText.className = "readonly-text";
        pText.textContent = item[pf.name] || "—";
        pField.appendChild(pText);
      } else {
        var pInput = document.createElement("input");
        pInput.type = "text";
        pInput.value = item[pf.name] || "";
        pInput.addEventListener("input", function (e) { item[pf.name] = e.target.value; });
        pField.appendChild(pInput);
      }
      itemCard.appendChild(pField);

      fieldsDef.forEach(function (f) {
        var field = document.createElement("div");
        field.className = "field";
        var label = document.createElement("label");
        label.textContent = f.label;
        field.appendChild(label);

        if (!f.translated) {
          if (locked) {
            var readonlyPlain = document.createElement("div");
            readonlyPlain.className = "readonly-text";
            readonlyPlain.textContent = item[f.name] || "—";
            field.appendChild(readonlyPlain);
          } else {
            var input = document.createElement("input");
            input.type = "text";
            input.value = item[f.name] || "";
            input.addEventListener("input", function (e) { item[f.name] = e.target.value; });
            field.appendChild(input);
          }
        } else if (locked) {
          // Existing item: already translated into { en, pt, es } — show
          // all three, read-only.
          if (!item[f.name] || typeof item[f.name] !== "object") {
            item[f.name] = { en: "", pt: "", es: "" };
          }
          LANGS.forEach(function (lang) {
            var displayText;
            if (f.type === "taglist") {
              var arr0 = Array.isArray(item[f.name][lang.code]) ? item[f.name][lang.code] : [];
              displayText = arr0.join(", ");
            } else {
              displayText = item[f.name][lang.code];
            }
            appendReadonlyRow(field, lang.tag, displayText);
          });
        } else {
          // New item: one Portuguese input — English/Spanish are filled
          // in automatically by translation when she saves.
          if (typeof item[f.name] !== "string") item[f.name] = "";
          var singleInput = document.createElement(f.type === "textarea" ? "textarea" : "input");
          if (f.type !== "textarea") singleInput.type = "text";
          singleInput.value = item[f.name];
          if (f.type === "taglist") singleInput.placeholder = "Ex.: Eletroporação, Oncologia";
          singleInput.addEventListener("input", function (e) { item[f.name] = e.target.value; });
          field.appendChild(singleInput);
        }

        itemCard.appendChild(field);
      });

      wrap.appendChild(itemCard);
    });
  }

  function renderCollectionItems(colDef) {
    var list = collectionsData[colDef.key] || (collectionsData[colDef.key] = []);
    renderItemList("collection-items-" + colDef.key, list, colDef.fields, colDef.periodField, function () {

  // ---------------------------------------------------------
  // Fully custom sections ("tópicos"): Maria can create whole new
  // sections from scratch — her own title, optional lead text, and
  // her own list of items (same shape as a project card: period,
  // title, subtitle, description, tags, link). A section only shows
  // up on the site once it has at least one item, and isn't added to
  // the top nav menu (the list can grow to any length).
  // ---------------------------------------------------------
  var CUSTOM_ITEM_FIELDS = [
    { name: "title", label: "Título", translated: true, type: "textarea" },
    { name: "subtitle", label: "Subtítulo (opcional)", translated: true, type: "text" },
    { name: "desc", label: "Descrição", translated: true, type: "textarea" },
    { name: "tags", label: "Tags (separe por vírgula, opcional)", translated: true, type: "taglist" },
    { name: "link", label: "Link (opcional)", translated: false, type: "text" }
  ];
  var CUSTOM_PERIOD_FIELD = { name: "period", label: "Ano / Período (opcional)" };

  var customSectionsData = [];
  var customSectionsRoot = document.getElementById("custom-sections-root");

  function blankCustomSection() {
    return { title: "", lead: "", items: [] };
  }

  function blankCustomItem() {
    return { period: "", title: "", subtitle: "", desc: "", tags: "", link: "" };
  }

  // Translates a not-yet-saved custom section's own title/lead (its items
  // are handled per-item via translateNewItemFields, same as any other
  // collection item).
  function translateNewSectionMeta(section) {
    var jobs = [];
    if (typeof section.title === "string") {
      jobs.push(translateField(section.title).then(function (r) { section.title = r; }));
    }
    if (typeof section.lead === "string") {
      jobs.push(translateField(section.lead).then(function (r) { section.lead = r; }));
    }
    return Promise.all(jobs);
  }

  function buildCustomSectionsUI() {
    customSectionsRoot.innerHTML = "";

    var header = document.createElement("div");
    header.className = "section-card";
    var h3 = document.createElement("h3");
    h3.textContent = "Seções personalizadas (novos tópicos)";

    addSectionBtn.className = "btn-add";

      if (sectionLocked) {
        if (!section.lead || typeof section.lead !== "object") section.lead = { en: "", pt: "", es: "" };
        LANGS.forEach(function (lang) { appendReadonlyRow(leadField, lang.tag, section.lead[lang.code]); });
      } else {

  // ---------------------------------------------------------
  // Profile photo: resized/compressed to a JPEG in the browser (so
  // uploads stay small and always land as photo.jpg regardless of the
  // original file type), then committed via its own endpoint — separate
  // from "Salvar alterações" since it's a different kind of save.
  // ---------------------------------------------------------
  var MAX_PHOTO_DIMENSION = 900;
  var PHOTO_JPEG_QUALITY = 0.85;
  var pendingPhotoDataUrl = null;

  // Always center-crops to a square before returning a data URL, so the
  // saved photo can never come out stretched or in a different
  // proportion than the frame it's displayed in on the site — only
  // ever a proper, undistorted crop.
  function centerCropToSquareDataUrl(img, maxDim, quality) {
    var srcSize = Math.min(img.width, img.height);
    var sx = (img.width - srcSize) / 2;
    var sy = (img.height - srcSize) / 2;
    var outSize = Math.min(maxDim, srcSize);
    var canvas = document.createElement("canvas");
    canvas.width = outSize;
    canvas.height = outSize;
    var ctx = canvas.getContext("2d");
    ctx.drawImage(img, sx, sy, srcSize, srcSize, 0, 0, outSize, outSize);
    return canvas.toDataURL("image/jpeg", quality);
  }

  function buildPhotoCard() {
    photoCardRoot.innerHTML = "";

    var card = document.createElement("div");
    card.className = "section-card";

    var h3 = document.createElement("h3");
    h3.textContent = "Foto de perfil";
    card.appendChild(h3);

    var hint = document.createElement("p");
    hint.className = "collection-hint";
    hint.textContent = "Aparece no topo do site. Formatos aceitos: JPG, PNG ou WEBP — a imagem é recortada automaticamente no centro para ficar quadrada (mesma proporção da foto atual), sem esticar ou distorcer, e depois redimensionada.";
    card.appendChild(hint);

    var row = document.createElement("div");
    row.style.display = "flex";
    row.style.alignItems = "center";
    row.style.gap = "1rem";
    row.style.marginBottom = "1rem";
    row.style.flexWrap = "wrap";

    var preview = document.createElement("img");
    preview.id = "photo-preview";
    preview.src = "/photo.jpg?t=" + Date.now();
    preview.alt = "Foto atual";
    preview.style.width = "6rem";
    preview.style.height = "6rem";
    preview.style.borderRadius = "12px";
    preview.style.objectFit = "cover";
    preview.style.border = "1px solid var(--border)";
    preview.style.background = "var(--surface)";
    row.appendChild(preview);

    var fileInput = document.createElement("input");
    fileInput.type = "file";
    fileInput.id = "photo-input";
    fileInput.accept = "image/*";
    row.appendChild(fileInput);

    card.appendChild(row);

    var saveBtn = document.createElement("button");
    saveBtn.type = "button";
    saveBtn.className = "btn-primary";
    saveBtn.style.width = "auto";
    saveBtn.style.marginTop = "0";
    saveBtn.textContent = "Salvar nova foto";
    card.appendChild(saveBtn);

    var photoStatus = document.createElement("div");
    photoStatus.id = "photo-status";
    photoStatus.style.marginTop = ".6rem";
    photoStatus.style.fontSize = ".88rem";
    card.appendChild(photoStatus);

    photoCardRoot.appendChild(card);

    fileInput.addEventListener("change", function (e) {
      var file = e.target.files[0];
      if (!file) return;
      pendingPhotoDataUrl = null;
      photoStatus.textContent = "Recortando…";
      photoStatus.className = "";
      var reader = new FileReader();
      reader.onload = function (ev) {
        var img = new Image();
        img.onload = function () {
          var cropped = centerCropToSquareDataUrl(img, MAX_PHOTO_DIMENSION, PHOTO_JPEG_QUALITY);
          pendingPhotoDataUrl = cropped;
          preview.src = cropped; // shows exactly what will be saved
          photoStatus.textContent = "Pronto — confira o recorte acima e clique em “Salvar nova foto”.";
        };
        img.onerror = function () {
          photoStatus.textContent = "Não consegui ler essa imagem. Tenta outro arquivo.";
          photoStatus.className = "err";
        };
        img.src = ev.target.result;
      };
      reader.onerror = function () {
        photoStatus.textContent = "Não consegui ler o arquivo.";
        photoStatus.className = "err";
      };
      reader.readAsDataURL(file);
    });

    saveBtn.addEventListener("click", function () {
      if (!pendingPhotoDataUrl) {
        photoStatus.textContent = "Escolha uma foto primeiro.";
        photoStatus.className = "err";
        return;
      }
      var token = getToken();
      if (!token) { showLogin("Sua sessão expirou. Entre novamente."); return; }

      photoStatus.textContent = "Salvando foto…";
      photoStatus.className = "";

      fetch("/api/save-photo", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ token: token, imageBase64: pendingPhotoDataUrl })
      })
        .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
        .then(function (res) {
          if (!res.ok) {
            photoStatus.textContent = res.data.error || "Erro ao salvar a foto.";
            photoStatus.className = "err";
            if (res.data.error && res.data.error.indexOf("expirad") !== -1) clearToken();
            return;
          }
          photoStatus.textContent = "Foto salva! O site atualiza em cerca de 1 minuto.";
          photoStatus.className = "ok";
        })
        .catch(function () {
          photoStatus.textContent = "Erro de conexão. Tenta salvar de novo.";
          photoStatus.className = "err";
        });
    });
  }

  // Strips the admin-only "_existing" bookkeeping flag before sending an
  // item to the server, so it never ends up persisted in content.json.
  function cleanItem(item) {
    var copy = {};
    Object.keys(item).forEach(function (k) {
      if (k !== "_existing") copy[k] = item[k];
    });
    return copy;
  }

  function collectContent() {
    // Start from the content exactly as loaded, so every fixed text this
    // panel no longer shows (nav labels, section titles/leads, the bio
    // paragraph, button text, etc.) is preserved untouched.
    var out = { en: {}, pt: {}, es: {} };
    LANGS.forEach(function (lang) {
      out[lang.code] = Object.assign({}, (originalContent && originalContent[lang.code]) || {});
    });
    // Then overlay only the fields this panel actually makes editable.
    Object.keys(fieldRefs).forEach(function (key) {
      LANGS.forEach(function (lang) {
        out[lang.code][key] = fieldRefs[key][lang.code].value;
      });
    });

    var cleanCollections = {};
    Object.keys(collectionsData).forEach(function (key) {
      if (key === "custom_sections" || key === "languages") return;
      cleanCollections[key] = (collectionsData[key] || []).map(cleanItem);
    });
    cleanCollections.custom_sections = customSectionsData.map(function (section) {
      return {
        title: section.title,
        lead: section.lead,
        _existing: section._existing, // stripped just below
        items: (section.items || []).map(cleanItem)
      };
    }).map(cleanItem);
    cleanCollections.languages = languagesData.map(cleanItem);

    out.collections = cleanCollections;
    return out;
  }

  // Runs every pending translation (new collection items, new custom
  // section titles/leads, new "other" language names) before a save, so
  // collectContent() only ever sees fully-translated { en, pt, es } data.
  function prepareAllTranslations() {
    translationHadError = false;
    var jobs = [];
    COLLECTIONS.forEach(function (colDef) {
      (collectionsData[colDef.key] || []).forEach(function (item) {
        if (!item._existing) jobs.push(translateNewItemFields(item, colDef.fields));
      });
    });
    customSectionsData.forEach(function (section) {
      if (!section._existing) jobs.push(translateNewSectionMeta(section));
      (section.items || []).forEach(function (item) {
        if (!item._existing) jobs.push(translateNewItemFields(item, CUSTOM_ITEM_FIELDS));
      });
    });
    languagesData.forEach(function (entry) {
      if (!entry._existing && entry.code === "other" && typeof entry.name === "string") {
        jobs.push(translateField(entry.name).then(function (r) { entry.name = r; }));
      }
    });
    return Promise.all(jobs);
  }

  // Marks everything currently in memory as already-saved, so the panel
  // immediately renders it read-only without needing a page reload.
  function lockEverythingAsExisting() {
    Object.keys(collectionsData).forEach(function (key) {
      if (key === "custom_sections" || key === "languages") return;
      (collectionsData[key] || []).forEach(function (item) { item._existing = true; });
    });
    customSectionsData.forEach(function (section) {
      section._existing = true;
      (section.items || []).forEach(function (item) { item._existing = true; });
    });
    languagesData.forEach(function (entry) { entry._existing = true; });
  }

  function loadEditor() {
    showEditor();
    editorLoading.style.display = "block";
    photoCardRoot.style.display = "none";
    sectionsEl.style.display = "none";
    languagesRoot.style.display = "none";
    collectionsRoot.style.display = "none";
    customSectionsRoot.style.display = "none";
    fetch("/content.json", { cache: "no-store" })
      .then(function (r) { return r.json(); })
      .then(function (content) {
        originalContent = { en: content.en || {}, pt: content.pt || {}, es: content.es || {} };
        buildPhotoCard();
        buildForm(content);
        collectionsData = content.collections && typeof content.collections === "object"
          ? content.collections
          : { projects: [], publications: [], certificates: [], education: [], custom_sections: [], languages: [] };
        if (!Array.isArray(collectionsData.projects)) collectionsData.projects = [];
        if (!Array.isArray(collectionsData.publications)) collectionsData.publications = [];
        if (!Array.isArray(collectionsData.certificates)) collectionsData.certificates = [];
        if (!Array.isArray(collectionsData.education)) collectionsData.education = [];
        markExisting(collectionsData.projects);
        markExisting(collectionsData.publications);
        markExisting(collectionsData.certificates);
        markExisting(collectionsData.education);
        customSectionsData = Array.isArray(collectionsData.custom_sections) ? collectionsData.custom_sections : [];
        customSectionsData.forEach(function (section) {
          section._existing = true;
          markExisting(section.items);
        });
        languagesData = Array.isArray(collectionsData.languages) ? collectionsData.languages : [];
        markExisting(languagesData);
        buildLanguagesUI();
        buildCollectionsUI();
        buildCustomSectionsUI();
        editorLoading.style.display = "none";
        photoCardRoot.style.display = "block";
        sectionsEl.style.display = "block";
        languagesRoot.style.display = "block";
        collectionsRoot.style.display = "block";
        customSectionsRoot.style.display = "block";
      })
      .catch(function () {
        editorLoading.textContent = "Não consegui carregar o conteúdo atual. Recarregue a página.";
      });
  }

  document.getElementById("login-btn").addEventListener("click", function () {
    var password = document.getElementById("password-input").value;
    if (!password) return;
    document.getElementById("login-error").textContent = "";
    fetch("/api/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password: password })
    })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          showLogin(res.data.error || "Senha incorreta.");
          return;
        }
        setToken(res.data.token);
        loadEditor();
      })
      .catch(function () {
        showLogin("Erro de conexão. Tenta de novo.");
      });
  });

  document.getElementById("password-input").addEventListener("keydown", function (e) {
    if (e.key === "Enter") document.getElementById("login-btn").click();
  });

  document.getElementById("logout-btn").addEventListener("click", function () {
    clearToken();
    showLogin();
  });

  document.getElementById("save-btn").addEventListener("click", function () {
    var token = getToken();
    if (!token) { showLogin("Sua sessão expirou. Entre novamente."); return; }

    statusEl.textContent = "Traduzindo conteúdo novo…";
    statusEl.className = "";

    prepareAllTranslations()
      .then(function () {
        statusEl.textContent = "Salvando…";
        return fetch("/api/save-content", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ token: token, content: collectContent() })
        });
      })
      .then(function (r) { return r.json().then(function (data) { return { ok: r.ok, data: data }; }); })
      .then(function (res) {
        if (!res.ok) {
          statusEl.textContent = res.data.error || "Erro ao salvar.";
          statusEl.className = "err";
          if (res.data.error && res.data.error.indexOf("expirad") !== -1) {
            clearToken();
          }
          return;
        }
        statusEl.textContent = translationHadError
          ? "Salvo! Algumas traduções automáticas falharam — o texto em português foi usado como reserva nesses campos. Vale conferir e, se precisar, remover e recriar o item."
          : "Salvo! O site atualiza em cerca de 1 minuto.";
        statusEl.className = "ok";
        lockEverythingAsExisting();
        buildCollectionsUI();
        renderCustomSectionsList();
        renderLanguagesList();
      })
      .catch(function () {
        statusEl.textContent = "Erro de conexão. Tenta salvar de novo.";
        statusEl.className = "err";
      });
  });

  // Boot: if a session token is already stored, skip straight to the editor.
  if (getToken()) {
    loadEditor();
  } else {
    showLogin();
  }
})();
</script>
</body>
</html>
